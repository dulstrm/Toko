<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dulz | strm • Public</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#101828}body{background:linear-gradient(160deg,#eef8ff,#fff 55%,#fff7c7)}.app{min-height:100vh;padding:20px 15px 105px;max-width:760px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px}.brand{font-size:25px;font-weight:850}.blue{color:#08aeea}.badge{background:#ffd21a;border:3px solid #111;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:900}.hero{padding:18px;border:2px solid #111;border-radius:25px;background:#fff;box-shadow:7px 7px 0 #111;margin-bottom:18px}.hero h1{margin:0 0 6px;font-size:27px}.hero p{margin:0;color:#596273;line-height:1.5}.section-title{font-size:18px;font-weight:900;margin:24px 3px 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.poster{overflow:hidden;border:3px solid #111;border-radius:21px;background:#ffd21a;box-shadow:6px 6px 0 #111;animation:up .4s ease both;cursor:pointer;transition:.16s}.poster:active{transform:scale(.97)}.poster img{width:100%;display:block;aspect-ratio:1/1;object-fit:cover;background:#fff;border-bottom:3px solid #111}.poster-body{padding:12px}.poster h3{margin:0 0 4px;font-size:17px}.price{font-weight:950;font-size:16px}.poster p{margin:5px 0 0;color:#242424;font-size:12px;line-height:1.35}.empty{grid-column:1/-1;text-align:center;padding:40px 20px;border:2px dashed #111;border-radius:20px;background:#fff}.home,.profile{display:none!important}.home.active,.profile.active{display:block!important}.home,.profile{animation:page .3s ease}input{width:100%;padding:15px;border:2px solid #111;background:#fff;color:#111;border-radius:15px;outline:none;font-size:15px}.btn{margin-top:11px;width:100%;border:2px solid #111;border-radius:15px;padding:14px;background:#08aeea;color:#fff;font-weight:900;box-shadow:4px 4px 0 #111}.result{margin-top:12px;padding:13px;border:2px solid #111;border-radius:15px;background:#fffde8;display:none}.result.show{display:block}.nav{position:fixed;z-index:20;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92%,440px);padding:7px;display:flex;gap:6px;border:3px solid #111;background:#08aeea;border-radius:22px;box-shadow:7px 7px 0 #111;backdrop-filter:blur(8px)}.nav button{flex:1;border:0;background:transparent;color:#fff;padding:9px;border-radius:16px;font-weight:900;font:800 12px inherit;transition:.25s}.nav button span{display:block;font-size:19px}.nav button.active{background:#ffd21a;color:#111;box-shadow:3px 3px 0 #111}.toast{position:fixed;z-index:50;left:50%;top:16px;transform:translate(-50%,-20px);opacity:0;padding:11px 15px;border:2px solid #111;border-radius:14px;background:#ffd21a;font-weight:800;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes page{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@media(max-width:430px){.grid{gap:11px}.poster-body{padding:10px}.poster h3{font-size:15px}}
</style></head>
<body><div class="app"><header><div class="brand">Dulz <span class="blue">| strm</span></div><div class="badge">PUBLIC</div></header>
<section id="home" class="home active"><div class="section-title">Semua Poster</div><div id="posters" class="grid"></div></section>
<section id="profile" class="profile"><div class="hero"><h1>Profil</h1><p>Masukkan kode promo yang diberikan oleh admin.</p><input id="promo" style="margin-top:13px" placeholder="Masukkan kode promo" autocomplete="off"><button class="btn" onclick="usePromo()">Gunakan Kode Promo</button><div id="result" class="result"></div></div></section></div>
<nav class="nav"><button id="nHome" class="active" onclick="showPage('home')"><span>⌂</span>Home</button><button id="nProfile" onclick="showPage('profile')"><span>◉</span>Profil</button></nav><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://tajjoyanlwrjedjsqzou.supabase.co';const SUPABASE_KEY='sb_publishable_488BNpJuQXLT6xyZECjwdw_napmuha0';const WHATSAPP='6288268102696';const {createClient}=supabase;const db=createClient(SUPABASE_URL,SUPABASE_KEY);
function showPage(p){
  document.querySelectorAll('.home,.profile').forEach(x=>x.classList.remove('active'));
  document.getElementById(p).classList.add('active');
  document.getElementById('nHome').classList.toggle('active',p==='home');
  document.getElementById('nProfile').classList.toggle('active',p==='profile');
  if(p==='home')loadPosters();
}
async function loadPosters(){const box=document.getElementById('posters');const {data,error}=await db.from('posters').select('id,title,description,price,image_url,published').eq('published',true).order('created_at',{ascending:false});if(error){box.innerHTML='<div class="empty">Gagal memuat poster.</div>';return}if(!data?.length){box.innerHTML='<div class="empty">Belum ada poster yang dipublikasikan.</div>';return}box.innerHTML=data.map((p,i)=>`<article class="poster" style="animation-delay:${i*.04}s" onclick='openWhatsApp(${JSON.stringify(p.title||"Poster")},${JSON.stringify(p.price||"")},${JSON.stringify(p.description||"")})' role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' ')openWhatsApp(${JSON.stringify(p.title||"Poster")},${JSON.stringify(p.price||"")},${JSON.stringify(p.description||"")})"><img src="${esc(p.image_url||'')}" alt="${esc(p.title)}" loading="lazy" decoding="async"><div class="poster-body"><h3>${esc(p.title)}</h3><div class="price">${esc(p.price||'')}</div><p>${esc(p.description||'')}</p></div></article>`).join('')}
function openWhatsApp(title,price,description){
  const cleanTitle=String(title||'Poster').trim();
  const cleanPrice=String(price||'').trim();
  const cleanDescription=String(description||'').trim();
  const text=[
    'Halo Admin Dulz | strm 👋',
    '',
    'Saya tertarik dengan poster:',
    `Nama: ${cleanTitle}`,
    cleanPrice?`Harga: ${cleanPrice}`:'',
    cleanDescription?`Deskripsi: ${cleanDescription}`:'',
    '',
    'Apakah poster ini masih tersedia?'
  ].filter(Boolean).join('\n');
  const url=`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(text)}`;
  window.location.href=url;
}
async function usePromo(){const code=document.getElementById('promo').value.trim().toUpperCase(),r=document.getElementById('result');if(!code)return toast('Masukkan kode promo');const {data,error}=await db.from('promos').select('code,title,description,active').eq('code',code).eq('active',true).maybeSingle();r.className='result show';r.innerHTML=error?'Terjadi kesalahan saat mengecek kode.':data?`<b>✓ Kode berhasil!</b><br>${esc(data.title||'Promo aktif')}<br><small>${esc(data.description||'')}</small>`:'Kode promo tidak ditemukan atau sudah nonaktif.'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}let tt;function toast(s){const x=document.getElementById('toast');x.textContent=s;x.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>x.classList.remove('show'),2000)}
loadPosters();
</script></body></html>
